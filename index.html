<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>TradingView – Final Working Setup</title>

    <!-- NON-standalone library -->
    <script src="charting_library/charting_library.js"></script>

    <style>
        html, body, #tv {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>
<div id="tv"></div>

<script type="module">
    import Datafeed from "./src/datafeed.js";

    const widget = new TradingView.widget({
        container: "tv",
        library_path: "charting_library/",
        datafeed: Datafeed,

        symbol: "NIFTY",
        interval: "1",

        timezone: "Asia/Kolkata",
        autosize: true,
        locale: "en",

        // 🔥 IMPORTANT
        disabled_features: ["use_localstorage_for_settings"],
        enabled_features: ["study_templates"]
    });

    widget.onChartReady(() => {
        const chart = widget.chart();

        // 🔥 Smooth TF switching fix
        chart.onIntervalChanged().subscribe(null, () => {
            setTimeout(() => {
                chart.executeActionById("chartAutoScale");
                chart.executeActionById("chartReset");
            }, 50);
        });
    });
</script>
</body>
</html>
