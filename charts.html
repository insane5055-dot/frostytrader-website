<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8" />

    <title>Frosty Trader Chart</title>

    <!-- TradingView -->
    <script src="charting_library/charting_library.js"></script>

    <!-- Socket.IO -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

    <style>

        html,
        body,
        #tv {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #ffffff;
        }

        /* =========================================
           🔥 EMA OVERLAY
        ========================================= */

        #ema-line {

            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            pointer-events: none;

            z-index: 999;
        }

    </style>

</head>

<body>

<div id="tv"></div>

<!-- =========================================
     🔥 EMA CANVAS
========================================= -->

<canvas id="ema-line"></canvas>

<script type="module">

import Datafeed from "./src/datafeed.js";

// =============================================
// 🔥 CREATE WIDGET
// =============================================

window.tvWidget = new TradingView.widget({

    container: "tv",

    library_path: "charting_library/",

    datafeed: Datafeed,

    locale: "en",

    timezone: "Asia/Kolkata",

    autosize: true,

    fullscreen: false,

    theme: "light",

    symbol: "NSE:NIFTY 50",

    interval: "1",

    disabled_features: [

        "use_localstorage_for_settings",

        "header_symbol_search_hot_key"
    ],

    loading_screen: {

        backgroundColor: "#ffffff",

        foregroundColor: "#2962ff"
    },

    overrides: {

        "paneProperties.background":
        "#ffffff",

        "paneProperties.vertGridProperties.color":
        "#f0f3fa",

        "paneProperties.horzGridProperties.color":
        "#f0f3fa",

        "scalesProperties.textColor":
        "#000000",

        "paneProperties.crossHairProperties.color":
        "#000000",

        "mainSeriesProperties.candleStyle.upColor":
        "#26a69a",

        "mainSeriesProperties.candleStyle.downColor":
        "#ef5350",

        "mainSeriesProperties.candleStyle.borderUpColor":
        "#26a69a",

        "mainSeriesProperties.candleStyle.borderDownColor":
        "#ef5350",

        "mainSeriesProperties.candleStyle.wickUpColor":
        "#26a69a",

        "mainSeriesProperties.candleStyle.wickDownColor":
        "#ef5350"
    }
});

// =============================================
// 🔥 CHART READY
// =============================================

window.tvWidget.onChartReady(() => {

    console.log("✅ TradingView Ready");

    const chart = window.tvWidget.chart();

    // =============================================
    // 🔥 SOCKET.IO
    // =============================================

    const socket = io("http://localhost:5000");

    // =============================================
    // 🔥 EMA CANVAS
    // =============================================

    const canvas = document.getElementById(
        "ema-line"
    );

    const ctx = canvas.getContext("2d");

    // =============================================
    // 🔥 RESIZE
    // =============================================

    function resizeCanvas() {

        canvas.width = window.innerWidth;

        canvas.height = window.innerHeight;
    }

    resizeCanvas();

    window.addEventListener(
        "resize",
        resizeCanvas
    );

    // =============================================
    // 🔥 EMA STORAGE
    // =============================================

    let emaPoints = [];

    // =============================================
    // 🔥 RECEIVE EMA
    // =============================================

    socket.on("tick_ema", (data) => {

        console.log("🔥 EMA:", data);

        emaPoints.push({

            time: data.time,

            ema: data.ema
        });

        // LIMIT
        if (emaPoints.length > 300) {

            emaPoints.shift();
        }

        drawEMA();
    });

    // =============================================
    // 🔥 DRAW EMA
    // =============================================

    function drawEMA() {

        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        if (emaPoints.length < 2) {
            return;
        }

        ctx.beginPath();

        ctx.lineWidth = 2;

        ctx.strokeStyle = "#2962ff";

        const maxEMA = Math.max(
            ...emaPoints.map(p => p.ema)
        );

        const minEMA = Math.min(
            ...emaPoints.map(p => p.ema)
        );

        const range = maxEMA - minEMA || 1;

        emaPoints.forEach((p, i) => {

            const x =
                (i / emaPoints.length)
                * canvas.width;

            const y =
                canvas.height -
                (
                    (p.ema - minEMA)
                    / range
                ) * canvas.height;

            if (i === 0) {

                ctx.moveTo(x, y);

            } else {

                ctx.lineTo(x, y);
            }
        });

        ctx.stroke();
    }

    // =============================================
    // 🔥 TIMEFRAME FIX
    // =============================================

    chart.onIntervalChanged().subscribe(

        null,

        () => {

            setTimeout(() => {

                try {

                    chart.executeActionById(
                        "chartAutoScale"
                    );

                    chart.executeActionById(
                        "chartReset"
                    );

                } catch (e) {

                    console.log(e);
                }

            }, 100);
        }
    );

});

</script>

</body>
</html>
