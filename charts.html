<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Frosty Trader Advanced DOM</title>

    <!-- ================================================= -->
    <!-- TRADINGVIEW -->
    <!-- ================================================= -->

    <script src="charting_library/charting_library.js"></script>

    <!-- ================================================= -->
    <!-- SOCKET.IO -->
    <!-- ================================================= -->

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

    <style>

        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #0d1117;

            font-family: Arial, sans-serif;
        }

        #layout {

            width: 100%;
            height: 100%;

            display: flex;
        }

        /* ================================================= */
        /* CHART */
        /* ================================================= */

        #tvchart {

            flex: 1;

            height: 100%;
        }

        /* ================================================= */
        /* DOM PANEL */
        /* ================================================= */

        #domPanel {

            width: 340px;

            background: #111827;

            color: white;

            border-left: 2px solid #1f2937;

            display: flex;

            flex-direction: column;
        }

        .domHeader {

            padding: 14px;

            font-size: 18px;

            font-weight: bold;

            text-align: center;

            background: #1f2937;

            border-bottom: 1px solid #374151;
        }

        .domTitles {

            display: grid;

            grid-template-columns: 1fr 1fr 1fr;

            padding: 10px;

            font-size: 13px;

            font-weight: bold;

            background: #111827;

            border-bottom: 1px solid #374151;

            text-align: center;
        }

        #domRows {

            flex: 1;

            overflow-y: auto;

            padding: 5px;
        }

        .domRow {

            display: grid;

            grid-template-columns: 1fr 1fr 1fr;

            gap: 5px;

            margin-bottom: 6px;
        }

        .bidBox {

            background: rgba(0, 255, 0, 0.15);

            border: 1px solid rgba(0,255,0,0.25);

            padding: 6px;

            border-radius: 6px;

            text-align: center;
        }

        .askBox {

            background: rgba(255, 0, 0, 0.15);

            border: 1px solid rgba(255,0,0,0.25);

            padding: 6px;

            border-radius: 6px;

            text-align: center;
        }

        .priceBox {

            background: #1f2937;

            border: 1px solid #374151;

            padding: 6px;

            border-radius: 6px;

            text-align: center;

            font-weight: bold;

            display: flex;

            align-items: center;

            justify-content: center;
        }

        .bigOrder {

            border: 2px solid yellow;

            box-shadow: 0 0 10px yellow;
        }

        .qtyText {

            font-size: 14px;

            font-weight: bold;
        }

        .orderText {

            font-size: 11px;

            margin-top: 2px;

            opacity: 0.8;
        }

        .timeText {

            font-size: 10px;

            margin-top: 3px;

            opacity: 0.6;
        }

    </style>

</head>

<body>

    <!-- ================================================= -->
    <!-- LAYOUT -->
    <!-- ================================================= -->

    <div id="layout">

        <!-- ============================================= -->
        <!-- TRADINGVIEW -->
        <!-- ============================================= -->

        <div id="tvchart"></div>

        <!-- ============================================= -->
        <!-- DOM -->
        <!-- ============================================= -->

        <div id="domPanel">

            <div class="domHeader">

                ADVANCE DOM

            </div>

            <div class="domTitles">

                <div>BID</div>

                <div>PRICE</div>

                <div>ASK</div>

            </div>

            <div id="domRows"></div>

        </div>

    </div>

    <script type="module">

        import Datafeed from "./src/datafeed.js";

        // =====================================================
        // SOCKET.IO
        // =====================================================

        const socket = io("http://localhost:5000");

        // =====================================================
        // TRADINGVIEW WIDGET
        // =====================================================

        const widget = new TradingView.widget({

            container: "tvchart",

            library_path: "./charting_library/",

            datafeed: Datafeed,

            locale: "en",

            timezone: "Asia/Kolkata",

            autosize: true,

            fullscreen: false,

            theme: "dark",

            symbol: "NSE:NIFTY 50",

            interval: "1",

            debug: false,

            enabled_features: [

                "study_templates"
            ],

            disabled_features: [

                "use_localstorage_for_settings",

                "volume_force_overlay",

                "header_compare",

                "header_symbol_search_hot_key"
            ],

            loading_screen: {

                backgroundColor: "#0d1117",

                foregroundColor: "#2962ff"
            },

            overrides: {

                // =============================================
                // BACKGROUND
                // =============================================

                "paneProperties.background": "#0d1117",

                "paneProperties.vertGridProperties.color": "#1f2937",

                "paneProperties.horzGridProperties.color": "#1f2937",

                // =============================================
                // TEXT
                // =============================================

                "scalesProperties.textColor": "#d1d4dc",

                // =============================================
                // CANDLES
                // =============================================

                "mainSeriesProperties.candleStyle.upColor": "#26a69a",

                "mainSeriesProperties.candleStyle.downColor": "#ef5350",

                "mainSeriesProperties.candleStyle.borderUpColor": "#26a69a",

                "mainSeriesProperties.candleStyle.borderDownColor": "#ef5350",

                "mainSeriesProperties.candleStyle.wickUpColor": "#26a69a",

                "mainSeriesProperties.candleStyle.wickDownColor": "#ef5350",

                // =============================================
                // PRICE LINE
                // =============================================

                "mainSeriesProperties.priceLineColor": "#2962ff",

                "mainSeriesProperties.showPriceLine": true,

                "mainSeriesProperties.showSeriesLastValue": true
            }
        });

        // =====================================================
        // DOM UPDATE
        // =====================================================

        socket.on("dom_update", (data) => {

            const rows = document.getElementById("domRows");

            rows.innerHTML = "";

            if (!data.bids || !data.asks) return;

            const maxBid = Math.max(
                ...data.bids.map(x => x.qty)
            );

            const maxAsk = Math.max(
                ...data.asks.map(x => x.qty)
            );

            for (let i = 0; i < 5; i++) {

                const bid = data.bids[i];

                const ask = data.asks[i];

                if (!bid || !ask) continue;

                const row = document.createElement("div");

                row.className = "domRow";

                row.innerHTML = `

                    <div class="bidBox ${bid.qty === maxBid ? 'bigOrder' : ''}">

                        <div class="qtyText">

                            ${bid.qty}

                        </div>

                        <div class="orderText">

                            ${bid.orders} ORD

                        </div>

                        <div class="timeText">

                            ${bid.time}

                        </div>

                    </div>

                    <div class="priceBox">

                        ${bid.price}

                    </div>

                    <div class="askBox ${ask.qty === maxAsk ? 'bigOrder' : ''}">

                        <div class="qtyText">

                            ${ask.qty}

                        </div>

                        <div class="orderText">

                            ${ask.orders} ORD

                        </div>

                        <div class="timeText">

                            ${ask.time}

                        </div>

                    </div>

                `;

                rows.appendChild(row);
            }
        });

        // =====================================================
        // CHART READY
        // =====================================================

        widget.onChartReady(() => {

            console.log("✅ TradingView Ready");

            const chart = widget.chart();

            // =================================================
            // SYMBOL CHANGE
            // =================================================

            chart.onSymbolChanged().subscribe(

                null,

                (symbolInfo) => {

                    console.log("📈 Symbol Changed:", symbolInfo);
                }
            );

            // =================================================
            // INTERVAL CHANGE
            // =================================================

            chart.onIntervalChanged().subscribe(

                null,

                (interval) => {

                    console.log("⏱ Interval Changed:", interval);

                    try {

                        chart.resetData();

                    } catch (e) {

                        console.log(e);
                    }
                }
            );

            // =================================================
            // INITIAL REFRESH
            // =================================================

            setTimeout(() => {

                try {

                    chart.resetData();

                } catch (e) {

                    console.log(e);
                }

            }, 1000);
        });

    </script>

</body>

</html>
