<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8" />

    <title>Frosty Trader Chart</title>

    <!-- TradingView -->
    <script src="charting_library/charting_library.js"></script>

    <!-- Socket.IO -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

    <style>

        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #ffffff;
        }

        #chart-container {

            position: relative;

            width: 100%;
            height: 100%;
        }

        #tv {

            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            z-index: 1;
        }

        #emaCanvas {

            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            z-index: 9999;

            pointer-events: none;
        }

    </style>

</head>

<body>

    <div id="chart-container">

        <div id="tv"></div>

        <canvas id="emaCanvas"></canvas>

    </div>

    <script type="module">

        import Datafeed from "./src/datafeed.js";

        // =====================================================
        // SOCKET.IO
        // =====================================================

        const socket = io({

            transports: ["websocket", "polling"]
        });

        // =====================================================
        // EMA STORAGE
        // =====================================================

        const emaData = [];

        const priceData = [];

        // =====================================================
        // CREATE TRADINGVIEW
        // =====================================================

        window.tvWidget = new TradingView.widget({

            container: "tv",

            library_path: "charting_library/",

            datafeed: Datafeed,

            locale: "en",

            timezone: "Asia/Kolkata",

            autosize: true,

            fullscreen: false,

            theme: "light",

            symbol: "NSE:NIFTY 50",

            interval: "1",

            enabled_features: [],

            disabled_features: [

                "use_localstorage_for_settings",

                "header_symbol_search_hot_key"
            ],

            loading_screen: {

                backgroundColor: "#ffffff",

                foregroundColor: "#2962ff"
            },

            overrides: {

                // =================================================
                // BACKGROUND
                // =================================================

                "paneProperties.background": "#ffffff",

                "paneProperties.vertGridProperties.color": "#f0f3fa",

                "paneProperties.horzGridProperties.color": "#f0f3fa",

                // =================================================
                // TEXT
                // =================================================

                "scalesProperties.textColor": "#000000",

                "paneProperties.crossHairProperties.color": "#000000",

                // =================================================
                // WATERMARK
                // =================================================

                "symbolWatermarkProperties.transparency": 0,

                // =================================================
                // CANDLE STYLE
                // =================================================

                "mainSeriesProperties.candleStyle.upColor": "#26a69a",

                "mainSeriesProperties.candleStyle.downColor": "#ef5350",

                "mainSeriesProperties.candleStyle.borderUpColor": "#26a69a",

                "mainSeriesProperties.candleStyle.borderDownColor": "#ef5350",

                "mainSeriesProperties.candleStyle.wickUpColor": "#26a69a",

                "mainSeriesProperties.candleStyle.wickDownColor": "#ef5350",

                // =================================================
                // PRICE LINE
                // =================================================

                "mainSeriesProperties.priceLineColor": "#2962ff",

                "mainSeriesProperties.showPriceLine": true,

                // =================================================
                // LAST VALUE
                // =================================================

                "mainSeriesProperties.showSeriesLastValue": true
            }
        });

        // =====================================================
        // CHART READY
        // =====================================================

        window.tvWidget.onChartReady(() => {

            console.log("✅ TradingView Ready");

            const chart = window.tvWidget.chart();

            // =================================================
            // EMA CANVAS
            // =================================================

            const canvas = document.getElementById("emaCanvas");

            const ctx = canvas.getContext("2d");

            // =================================================
            // RESIZE
            // =================================================

            function resizeCanvas() {

                canvas.width = window.innerWidth;

                canvas.height = window.innerHeight;
            }

            resizeCanvas();

            window.addEventListener(
                "resize",
                resizeCanvas
            );

            // =================================================
            // SOCKET CONNECT
            // =================================================

            socket.on("connect", () => {

                console.log("🟢 WebSocket Connected");
            });

            socket.on("disconnect", () => {

                console.log("🔴 WebSocket Disconnected");
            });

            // =================================================
            // RECEIVE EMA
            // =================================================

            socket.on("tick_ema", (data) => {

                // =============================================
                // DEBUG
                // =============================================

                console.log("EMA:", data);

                // =============================================
                // STORE DATA
                // =============================================

                emaData.push({

                    time: data.time,

                    value: data.ema
                });

                priceData.push(data.price);

                // =============================================
                // LIMIT
                // =============================================

                if (emaData.length > 1000) {

                    emaData.shift();

                    priceData.shift();
                }

                // =============================================
                // DRAW
                // =============================================

                drawEMA();
            });

            // =================================================
            // DRAW EMA
            // =================================================

            function drawEMA() {

                ctx.clearRect(

                    0,
                    0,
                    canvas.width,
                    canvas.height
                );

                if (emaData.length < 2)
                    return;

                // =============================================
                // PRICE RANGE
                // =============================================

                const maxPrice = Math.max(...priceData);

                const minPrice = Math.min(...priceData);

                const range = maxPrice - minPrice;

                if (range <= 0)
                    return;

                // =============================================
                // STYLE
                // =============================================

                ctx.beginPath();

                ctx.lineWidth = 2;

                ctx.strokeStyle = "#2962ff";

                // =============================================
                // DRAW LINE
                // =============================================

                emaData.forEach((point, index) => {

                    const x = (

                        index / (emaData.length - 1)

                    ) * canvas.width;

                    const y = (

                        canvas.height -

                        (
                            (
                                point.value - minPrice
                            ) / range
                        ) * canvas.height

                    );

                    if (index === 0) {

                        ctx.moveTo(x, y);

                    } else {

                        ctx.lineTo(x, y);
                    }
                });

                ctx.stroke();
            }

            // =================================================
            // SYMBOL CHANGE
            // =================================================

            chart.onSymbolChanged().subscribe(

                null,

                (symbolInfo) => {

                    console.log(
                        "📈 Symbol Changed:",
                        symbolInfo
                    );

                    emaData.length = 0;

                    priceData.length = 0;

                    ctx.clearRect(

                        0,
                        0,
                        canvas.width,
                        canvas.height
                    );
                }
            );

        });

    </script>

</body>

</html>
