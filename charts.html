<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8" />

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    />

    <title>Frosty Trader</title>

    <!-- ================================================= -->
    <!-- TRADINGVIEW LIBRARY -->
    <!-- ================================================= -->

    <script
        type="text/javascript"
        src="./charting_library/charting_library.js">
    </script>

    <!-- ================================================= -->
    <!-- SOCKET.IO -->
    <!-- ================================================= -->

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

    <style>

        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #ffffff;

            font-family: Arial, sans-serif;
        }

        #tvchart {

            width: 100%;
            height: 100vh;
        }

    </style>

</head>

<body>

    <!-- ================================================= -->
    <!-- CHART -->
    <!-- ================================================= -->

    <div id="tvchart"></div>

    <!-- ================================================= -->
    <!-- DATAFEED -->
    <!-- ================================================= -->

    <script type="module">

        import Datafeed from "./src/datafeed.js";

        // =================================================
        // WAIT FOR TV LIBRARY
        // =================================================

        function startChart() {

            if (
                typeof TradingView === "undefined"
            ) {

                console.log(
                    "⌛ Waiting for TradingView..."
                );

                setTimeout(
                    startChart,
                    500
                );

                return;
            }

            console.log(
                "✅ TradingView Loaded"
            );

            // =============================================
            // CREATE WIDGET
            // =============================================

            const widget = new TradingView.widget({

                // =========================================
                // CONTAINER
                // =========================================

                container: "tvchart",

                // =========================================
                // LIBRARY PATH
                // =========================================

                library_path:
                "./charting_library/",

                // =========================================
                // DATAFEED
                // =========================================

                datafeed:
                Datafeed,

                // =========================================
                // BASIC
                // =========================================

                locale:
                "en",

                timezone:
                "Asia/Kolkata",

                autosize:
                true,

                fullscreen:
                false,

                debug:
                true,

                theme:
                "light",

                // =========================================
                // DEFAULT SYMBOL
                // =========================================

                symbol:
                "NSE:NIFTY 50",

                interval:
                "1",

                // =========================================
                // ENABLE FEATURES
                // =========================================

                enabled_features: [

                    "study_templates"
                ],

                // =========================================
                // DISABLE FEATURES
                // =========================================

                disabled_features: [

                    "use_localstorage_for_settings",

                    "header_compare",

                    "header_symbol_search_hot_key",

                    "timeframes_toolbar"
                ],

                // =========================================
                // LOADING SCREEN
                // =========================================

                loading_screen: {

                    backgroundColor:
                    "#ffffff",

                    foregroundColor:
                    "#2962ff"
                },

                // =========================================
                // OVERRIDES
                // =========================================

                overrides: {

                    // =====================================
                    // BACKGROUND
                    // =====================================

                    "paneProperties.background":
                    "#ffffff",

                    "paneProperties.vertGridProperties.color":
                    "#f0f3fa",

                    "paneProperties.horzGridProperties.color":
                    "#f0f3fa",

                    // =====================================
                    // TEXT
                    // =====================================

                    "scalesProperties.textColor":
                    "#000000",

                    // =====================================
                    // CROSSHAIR
                    // =====================================

                    "paneProperties.crossHairProperties.color":
                    "#758696",

                    // =====================================
                    // WATERMARK
                    // =====================================

                    "symbolWatermarkProperties.transparency":
                    90,

                    // =====================================
                    // CANDLES
                    // =====================================

                    "mainSeriesProperties.candleStyle.upColor":
                    "#26a69a",

                    "mainSeriesProperties.candleStyle.downColor":
                    "#ef5350",

                    "mainSeriesProperties.candleStyle.borderUpColor":
                    "#26a69a",

                    "mainSeriesProperties.candleStyle.borderDownColor":
                    "#ef5350",

                    "mainSeriesProperties.candleStyle.wickUpColor":
                    "#26a69a",

                    "mainSeriesProperties.candleStyle.wickDownColor":
                    "#ef5350",

                    // =====================================
                    // PRICE LINE
                    // =====================================

                    "mainSeriesProperties.priceLineColor":
                    "#2962ff"
                }
            });

            // =============================================
            // CHART READY
            // =============================================

            widget.onChartReady(() => {

                console.log(
                    "✅ CHART READY"
                );

                const chart =
                    widget.activeChart();

                // =========================================
                // DATA READY
                // =========================================

                chart.dataReady(() => {

                    console.log(
                        "✅ DATA LOADED"
                    );
                });

                // =========================================
                // SYMBOL CHANGE
                // =========================================

                chart.onSymbolChanged().subscribe(

                    null,

                    (symbolInfo) => {

                        console.log(
                            "📈 SYMBOL CHANGED:",
                            symbolInfo
                        );
                    }
                );

                // =========================================
                // INTERVAL CHANGE
                // =========================================

                chart.onIntervalChanged().subscribe(

                    null,

                    (interval) => {

                        console.log(
                            "⏱ INTERVAL:",
                            interval
                        );
                    }
                );

                // =========================================
                // FORCE REFRESH
                // =========================================

                setTimeout(() => {

                    try {

                        chart.resetData();

                        console.log(
                            "🔄 DATA REFRESHED"
                        );

                    } catch (err) {

                        console.log(
                            "❌ REFRESH ERROR:",
                            err
                        );
                    }

                }, 3000);
            });
        }

        // =================================================
        // START
        // =================================================

        startChart();

    </script>

</body>

</html>
