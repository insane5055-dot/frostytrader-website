<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <title>TradingView – Final Working Setup</title>

    <!-- TradingView Library -->
    <script src="charting_library/charting_library.js"></script>

    <!-- Socket.IO -->
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>

    <style>
        html,
        body,
        #tv {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>

<div id="tv"></div>

<script type="module">

import Datafeed from "./src/datafeed.js";

const widget = new TradingView.widget({

    container: "tv",

    library_path: "charting_library/",

    datafeed: Datafeed,

    symbol: "NSE:Nifty 50",

    interval: "1",

    timezone: "Asia/Kolkata",

    autosize: true,

    locale: "en",

    // =====================================================
    // FEATURES
    // =====================================================
    disabled_features: [
        "use_localstorage_for_settings"
    ],

    enabled_features: [
        "study_templates",
        "custom_indicators"
    ],

    // =====================================================
    // 🔥 CUSTOM INDICATORS
    // =====================================================
    custom_indicators_getter: function(PineJS) {

    console.log("CUSTOM INDICATOR FUNCTION RUNNING");

    return Promise.resolve([

        {

            name: "AHLMA",

            metainfo: {

                _metainfoVersion: 53,

                id: "AHLMA@tv-basicstudies-1",

                description: "Average High Low MA",

                shortDescription: "AHLMA",

                isCustomIndicator: true,

                is_price_study: true,

                linkedToSeries: true,

                format: {
                    type: "price",
                    precision: 2
                },

                plots: [

                    {
                        id: "plot_0",
                        type: "line"
                    },

                    {
                        id: "plot_1",
                        type: "line"
                    }

                ],

                defaults: {

                    styles: {

                        plot_0: {
                            linestyle: 0,
                            linewidth: 2,
                            plottype: 0,
                            trackPrice: false,
                            transparency: 0,
                            visible: true,
                            color: "#ff0000"
                        },

                        plot_1: {
                            linestyle: 0,
                            linewidth: 2,
                            plottype: 0,
                            trackPrice: false,
                            transparency: 0,
                            visible: true,
                            color: "#00ff00"
                        }

                    },

                    inputs: {
                        length: 20
                    }
                },

                styles: {

                    plot_0: {
                        title: "High MA"
                    },

                    plot_1: {
                        title: "Low MA"
                    }

                },

                inputs: [

                    {
                        id: "length",
                        name: "Length",
                        defval: 20,
                        type: "integer",
                        min: 1,
                        max: 500
                    }

                ]
            },

            constructor: function() {

                this.init = function(context, inputCallback) {

                    this._context = context;
                    this._input = inputCallback;

                };

                this.main = function(context, inputCallback) {

                    this._context = context;
                    this._input = inputCallback;

                    const length = this._input(0);

                    const high_sma = PineJS.Std.sma(
                        PineJS.Std.high(this._context),
                        length,
                        this._context
                    );

                    const low_sma = PineJS.Std.sma(
                        PineJS.Std.low(this._context),
                        length,
                        this._context
                    );

                    return [

                        high_sma,
                        low_sma

                    ];
                };
            }
        }

    ]);
},

// =====================================================
// 🔥 CHART READY
// =====================================================
widget.onChartReady(() => {

    console.log("✅ Chart Ready");

    const chart = widget.chart();

    // =====================================================
    // 🔥 DEBUG
    // =====================================================
    console.log("🔥 Custom Indicator Loaded");

    // =====================================================
    // 🔥 Smooth TF Switching Fix
    // =====================================================
    chart.onIntervalChanged().subscribe(null, () => {

        setTimeout(() => {

            chart.executeActionById("chartAutoScale");

            chart.executeActionById("chartReset");

        }, 50);

    });

});

</script>

</body>
</html>
