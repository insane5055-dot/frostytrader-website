<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8" />

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    />

    <title>Frosty Trader</title>

    <!-- ================================================= -->
    <!-- TRADINGVIEW -->
    <!-- ================================================= -->

    <script src="./charting_library/charting_library.js"></script>

    <!-- ================================================= -->
    <!-- SOCKET.IO -->
    <!-- ================================================= -->

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

    <style>

        html,
        body,
        #tvchart {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #ffffff;
        }

    </style>

</head>

<body>

    <!-- ================================================= -->
    <!-- CHART CONTAINER -->
    <!-- ================================================= -->

    <div id="tvchart"></div>

    <script type="module">

        // =====================================================
        // IMPORT DATAFEED
        // =====================================================

        import Datafeed from "./src/datafeed.js";

        // =====================================================
        // CREATE WIDGET
        // =====================================================

        const widget = new TradingView.widget({

            // =================================================
            // BASIC
            // =================================================

            container: "tvchart",

            library_path: "./charting_library/",

            datafeed: Datafeed,

            locale: "en",

            timezone: "Asia/Kolkata",

            autosize: true,

            fullscreen: false,

            theme: "light",

            debug: true,

            // =================================================
            // DEFAULT SYMBOL
            // =================================================

            symbol: "NSE:NIFTY 50",

            interval: "1",

            // =================================================
            // FEATURES
            // =================================================

            enabled_features: [

                "study_templates"
            ],

            disabled_features: [

                "use_localstorage_for_settings",

                "header_compare",

                "header_symbol_search_hot_key",

                "timeframes_toolbar"
            ],

            // =================================================
            // LOADING SCREEN
            // =================================================

            loading_screen: {

                backgroundColor: "#ffffff",

                foregroundColor: "#2962ff"
            },

            // =================================================
            // OVERRIDES
            // =================================================

            overrides: {

                // =============================================
                // BACKGROUND
                // =============================================

                "paneProperties.background":
                "#ffffff",

                "paneProperties.vertGridProperties.color":
                "#f0f3fa",

                "paneProperties.horzGridProperties.color":
                "#f0f3fa",

                // =============================================
                // TEXT
                // =============================================

                "scalesProperties.textColor":
                "#000000",

                // =============================================
                // CROSSHAIR
                // =============================================

                "paneProperties.crossHairProperties.color":
                "#758696",

                // =============================================
                // WATERMARK
                // =============================================

                "symbolWatermarkProperties.transparency":
                90,

                // =============================================
                // CANDLE COLORS
                // =============================================

                "mainSeriesProperties.candleStyle.upColor":
                "#26a69a",

                "mainSeriesProperties.candleStyle.downColor":
                "#ef5350",

                "mainSeriesProperties.candleStyle.borderUpColor":
                "#26a69a",

                "mainSeriesProperties.candleStyle.borderDownColor":
                "#ef5350",

                "mainSeriesProperties.candleStyle.wickUpColor":
                "#26a69a",

                "mainSeriesProperties.candleStyle.wickDownColor":
                "#ef5350",

                // =============================================
                // PRICE LINE
                // =============================================

                "mainSeriesProperties.priceLineColor":
                "#2962ff"
            }
        });

        // =====================================================
        // READY
        // =====================================================

        widget.onChartReady(() => {

            console.log("✅ TradingView Ready");

            const chart = widget.activeChart();

            // =================================================
            // DATA READY
            // =================================================

            chart.dataReady(() => {

                console.log("✅ Chart Data Loaded");
            });

            // =================================================
            // SYMBOL CHANGED
            // =================================================

            chart.onSymbolChanged().subscribe(

                null,

                (symbolInfo) => {

                    console.log(
                        "📈 Symbol Changed:",
                        symbolInfo
                    );
                }
            );

            // =================================================
            // INTERVAL CHANGED
            // =================================================

            chart.onIntervalChanged().subscribe(

                null,

                (interval) => {

                    console.log(
                        "⏱ Interval Changed:",
                        interval
                    );
                }
            );

            // =================================================
            // FORCE REFRESH
            // =================================================

            setTimeout(() => {

                try {

                    chart.resetData();

                    console.log("🔄 Chart Refreshed");

                } catch (e) {

                    console.log("❌ Refresh Error:", e);
                }

            }, 3000);
        });

    </script>

</body>

</html>
