<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Frosty Trader Chart</title>

    <!-- ================================================= -->
    <!-- TRADINGVIEW LIBRARY -->
    <!-- ================================================= -->

    <script src="charting_library/charting_library.js"></script>

    <!-- ================================================= -->
    <!-- SOCKET.IO -->
    <!-- ================================================= -->

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

    <style>

        html,
        body,
        #tvchart {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #ffffff;
        }

    </style>

</head>

<body>

    <div id="tvchart"></div>

    <script type="module">

        import Datafeed from "./src/datafeed.js";

        // =====================================================
        // CREATE WIDGET
        // =====================================================

        const widget = new TradingView.widget({

            // =================================================
            // BASIC
            // =================================================

            container: "tvchart",

            library_path: "./charting_library/",

            datafeed: Datafeed,

            locale: "en",

            timezone: "Asia/Kolkata",

            autosize: true,

            fullscreen: false,

            theme: "light",

            symbol: "NSE:NIFTY 50",

            interval: "1",

            debug: false,

            load_last_chart: false,

            // =================================================
            // FEATURES
            // =================================================

            enabled_features: [

                "study_templates"

            ],

            disabled_features: [

                "use_localstorage_for_settings",

                "volume_force_overlay",

                "header_compare",

                "header_symbol_search_hot_key",

                "left_toolbar",

                "timeframes_toolbar"

            ],

            // =================================================
            // LOADING SCREEN
            // =================================================

            loading_screen: {

                backgroundColor: "#ffffff",

                foregroundColor: "#2962ff"
            },

            // =================================================
            // OVERRIDES
            // =================================================

            overrides: {

                // =============================================
                // BACKGROUND
                // =============================================

                "paneProperties.background": "#ffffff",

                "paneProperties.vertGridProperties.color": "#f0f3fa",

                "paneProperties.horzGridProperties.color": "#f0f3fa",

                // =============================================
                // TEXT
                // =============================================

                "scalesProperties.textColor": "#000000",

                // =============================================
                // CROSSHAIR
                // =============================================

                "paneProperties.crossHairProperties.color": "#758696",

                // =============================================
                // WATERMARK
                // =============================================

                "symbolWatermarkProperties.transparency": 90,

                // =============================================
                // CANDLE COLORS
                // =============================================

                "mainSeriesProperties.candleStyle.upColor": "#9bbb59",

                "mainSeriesProperties.candleStyle.downColor": "#ef5350",

                "mainSeriesProperties.candleStyle.borderUpColor": "#9bbb59",

                "mainSeriesProperties.candleStyle.borderDownColor": "#ef5350",

                "mainSeriesProperties.candleStyle.wickUpColor": "#000000",

                "mainSeriesProperties.candleStyle.wickDownColor": "#000000",

                // =============================================
                // PRICE LINE
                // =============================================

                "mainSeriesProperties.priceLineColor": "#2962ff",

                "mainSeriesProperties.showPriceLine": true,

                // =============================================
                // LAST VALUE
                // =============================================

                "mainSeriesProperties.showSeriesLastValue": true
            }
        });

        // =====================================================
        // CHART READY
        // =====================================================

        widget.onChartReady(() => {

            console.log("✅ TradingView Ready");

            const chart = widget.chart();

            // =================================================
            // FORMAT VOLUME
            // =================================================

            function formatVolume(v) {

                if (!v) return "";

                if (v >= 1000000) {

                    return (v / 1000000).toFixed(1) + "M";
                }

                if (v >= 1000) {

                    return Math.round(v / 1000) + "K";
                }

                return String(v);
            }

            // =================================================
            // DRAW VOLUME LABELS
            // =================================================

            async function drawVolumeLabels() {

                try {

                    // remove old labels
                    chart.removeAllShapes();

                    // =========================================
                    // GET VISIBLE RANGE
                    // =========================================

                    const visibleRange =
                        chart.getVisibleRange();

                    if (!visibleRange) {
                        return;
                    }

                    // =========================================
                    // GET BARS FROM DATAFEED
                    // =========================================

                    const symbol =
                        chart.symbol();

                    const interval =
                        chart.resolution();

                    const from =
                        visibleRange.from;

                    const to =
                        visibleRange.to;

                    // =========================================
                    // RESOLVE SYMBOL
                    // =========================================

                    const resolveRes = await fetch(

                        `https://frosty-backend-4mox.onrender.com/resolve?symbol=${encodeURIComponent(symbol)}`
                    );

                    const resolveData =
                        await resolveRes.json();

                    // =========================================
                    // HISTORY
                    // =========================================

                    const historyUrl =

                        `https://frosty-backend-4mox.onrender.com/history` +

                        `?security_id=${resolveData.security_id}` +

                        `&exchange=${resolveData.exchange_segment}` +

                        `&instrument=${resolveData.instrument}` +

                        `&resolution=${interval}` +

                        `&from=${Math.floor(from)}` +

                        `&to=${Math.floor(to)}`;

                    const historyRes =
                        await fetch(historyUrl);

                    const data =
                        await historyRes.json();

                    if (data.s !== "ok") {
                        return;
                    }

                    // =========================================
                    // CREATE LABELS
                    // =========================================

                    for (let i = 0; i < data.t.length; i++) {

                        const volume = data.v[i];

                        const low = data.l[i];

                        const time = data.t[i];

                        if (!volume) {
                            continue;
                        }

                        chart.createMultipointShape(

                            [
                                {
                                    time: time,

                                    price: low
                                }
                            ],

                            {
                                shape: "text",

                                text: formatVolume(volume),

                                lock: true,

                                disableSelection: true,

                                disableSave: true,

                                disableUndo: true,

                                overrides: {

                                    color: "#000000",

                                    fontsize: 10,

                                    bold: true,

                                    backgroundColor: "transparent"
                                }
                            }
                        );
                    }

                    console.log("✅ Volume labels drawn");

                } catch (e) {

                    console.log("❌ Volume Label Error:", e);
                }
            }

            // =================================================
            // INITIAL DRAW
            // =================================================

            setTimeout(() => {

                drawVolumeLabels();

            }, 3000);

            // =================================================
            // SYMBOL CHANGE
            // =================================================

            chart.onSymbolChanged().subscribe(

                null,

                () => {

                    setTimeout(() => {

                        drawVolumeLabels();

                    }, 2000);
                }
            );

            // =================================================
            // INTERVAL CHANGE
            // =================================================

            chart.onIntervalChanged().subscribe(

                null,

                () => {

                    setTimeout(() => {

                        drawVolumeLabels();

                    }, 2000);
                }
            );

            console.log("⚡ Ultra Fast Mode Enabled");
        });

    </script>

</body>

</html>
