<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />

    <title>Frosty Trader Chart</title>

    <!-- TradingView Library -->
    <script src="charting_library/charting_library.js"></script>

    <!-- Socket.IO -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

    <style>
        html,
        body,
        #tv {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #ffffff;
        }

        /* ================================================= */
        /* TICK EMA BOX */
        /* ================================================= */

        #tick-ema-box {

            position: absolute;

            top: 12px;

            right: 70px;

            z-index: 99999;

            background: rgba(255, 255, 255, 0.96);

            border: 1px solid #dcdcdc;

            border-radius: 12px;

            padding: 12px 16px;

            font-family: Arial;

            font-size: 14px;

            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.12);

            min-width: 190px;

            backdrop-filter: blur(6px);
        }

        #tick-ema-box .row {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 10px;
        }

        #tick-ema-box .row:last-child {

            margin-bottom: 0;
        }

        .label {

            color: #666;

            font-weight: 600;
        }

        #live-price {

            font-weight: bold;

            font-size: 15px;

            color: #2962ff;
        }

        #live-ema {

            font-weight: bold;

            font-size: 15px;

            color: #ff6d00;
        }

        #signal {

            font-weight: bold;

            font-size: 14px;

            padding: 4px 10px;

            border-radius: 6px;

            color: white;

            background: gray;
        }
    </style>
</head>

<body>

    <!-- ================================================= -->
    <!-- TV CHART -->
    <!-- ================================================= -->

    <div id="tv"></div>

    <!-- ================================================= -->
    <!-- TICK EMA BOX -->
    <!-- ================================================= -->

    <div id="tick-ema-box">

        <div class="row">

            <span class="label">
                PRICE
            </span>

            <span id="live-price">
                0
            </span>

        </div>

        <div class="row">

            <span class="label">
                TICK EMA
            </span>

            <span id="live-ema">
                0
            </span>

        </div>

        <div class="row">

            <span class="label">
                SIGNAL
            </span>

            <span id="signal">
                WAIT
            </span>

        </div>

    </div>

    <script type="module">

        import Datafeed from "./src/datafeed.js";

        // =====================================================
        // SOCKET.IO
        // =====================================================

        const socket = io("http://localhost:5000");

        // =====================================================
        // CREATE WIDGET
        // =====================================================

        window.tvWidget = new TradingView.widget({

            // =================================================
            // CONTAINER
            // =================================================

            container: "tv",

            library_path: "charting_library/",

            datafeed: Datafeed,

            locale: "en",

            timezone: "Asia/Kolkata",

            autosize: true,

            fullscreen: false,

            theme: "light",

            // =================================================
            // DEFAULT SYMBOL
            // =================================================

            symbol: "NSE:NIFTY 50",

            interval: "1",

            // =================================================
            // FEATURES
            // =================================================

            enabled_features: [],

            disabled_features: [

                "use_localstorage_for_settings",

                "header_symbol_search_hot_key"
            ],

            // =================================================
            // LOADING SCREEN
            // =================================================

            loading_screen: {

                backgroundColor: "#ffffff",

                foregroundColor: "#2962ff"
            },

            // =================================================
            // OVERRIDES
            // =================================================

            overrides: {

                // =============================================
                // BACKGROUND
                // =============================================

                "paneProperties.background": "#ffffff",

                "paneProperties.vertGridProperties.color": "#f0f3fa",

                "paneProperties.horzGridProperties.color": "#f0f3fa",

                // =============================================
                // TEXT
                // =============================================

                "scalesProperties.textColor": "#000000",

                "paneProperties.crossHairProperties.color": "#000000",

                // =============================================
                // WATERMARK
                // =============================================

                "symbolWatermarkProperties.transparency": 0,

                // =============================================
                // CANDLES
                // =============================================

                "mainSeriesProperties.candleStyle.upColor": "#26a69a",

                "mainSeriesProperties.candleStyle.downColor": "#ef5350",

                "mainSeriesProperties.candleStyle.borderUpColor": "#26a69a",

                "mainSeriesProperties.candleStyle.borderDownColor": "#ef5350",

                "mainSeriesProperties.candleStyle.wickUpColor": "#26a69a",

                "mainSeriesProperties.candleStyle.wickDownColor": "#ef5350",

                // =============================================
                // PRICE LINE
                // =============================================

                "mainSeriesProperties.priceLineColor": "#2962ff",

                "mainSeriesProperties.showPriceLine": true,

                // =============================================
                // LAST VALUE
                // =============================================

                "mainSeriesProperties.showSeriesLastValue": true
            }
        });

        // =====================================================
        // CHART READY
        // =====================================================

        window.tvWidget.onChartReady(() => {

            console.log("✅ TradingView Ready");

            const chart = window.tvWidget.chart();

            // =================================================
            // SOCKET LIVE EMA
            // =================================================

            socket.on("tick_ema", (data) => {

                const priceEl = document.getElementById("live-price");

                const emaEl = document.getElementById("live-ema");

                const signalEl = document.getElementById("signal");

                const price = parseFloat(data.price);

                const ema = parseFloat(data.ema);

                // =============================================
                // UPDATE VALUES
                // =============================================

                priceEl.innerText = price.toFixed(2);

                emaEl.innerText = ema.toFixed(2);

                // =============================================
                // BUY SIGNAL
                // =============================================

                if (price > ema) {

                    priceEl.style.color = "#00b386";

                    signalEl.innerText = "BUY";

                    signalEl.style.background = "#00b386";
                }

                // =============================================
                // SELL SIGNAL
                // =============================================

                else if (price < ema) {

                    priceEl.style.color = "#ff4d4f";

                    signalEl.innerText = "SELL";

                    signalEl.style.background = "#ff4d4f";
                }

                // =============================================
                // WAIT SIGNAL
                // =============================================

                else {

                    signalEl.innerText = "WAIT";

                    signalEl.style.background = "gray";
                }
            });

            // =================================================
            // TIMEFRAME CHANGE FIX
            // =================================================

            chart.onIntervalChanged().subscribe(null, () => {

                console.log("⏱ Timeframe Changed");

                setTimeout(() => {

                    try {

                        chart.executeActionById("chartAutoScale");

                        chart.executeActionById("chartReset");

                    }

                    catch (e) {

                        console.log("AutoScale Error:", e);
                    }

                }, 100);
            });

            // =================================================
            // SYMBOL CHANGE
            // =================================================

            chart.onSymbolChanged().subscribe(null, (symbolInfo) => {

                console.log("📈 Symbol Changed:", symbolInfo);
            });

            // =================================================
            // AUTO FIT CONTENT
            // =================================================

            setTimeout(() => {

                try {

                    chart.executeActionById("chartAutoScale");

                }

                catch (e) {

                    console.log(e);
                }

            }, 1000);
        });

    </script>

</body>

</html>
