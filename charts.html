<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8" />

    <title>Frosty Trader Chart</title>

    <!-- TradingView -->
    <script src="charting_library/charting_library.js"></script>

    <!-- Socket.IO -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

    <style>

        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #ffffff;
        }

        #chart-container {

            position: relative;

            width: 100%;
            height: 100%;
        }

        #tv {

            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            z-index: 1;
        }

        #emaCanvas {

            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            z-index: 10;

            pointer-events: none;
        }

    </style>

</head>

<body>

    <div id="chart-container">

        <div id="tv"></div>

        <canvas id="emaCanvas"></canvas>

    </div>

    <script type="module">

        import Datafeed from "./src/datafeed.js";

        // =====================================================
        // SOCKET.IO
        // =====================================================

        const socket = io("http://localhost:5000");

        // =====================================================
        // EMA STORAGE
        // =====================================================

        const emaPoints = [];

        const pricePoints = [];

        // =====================================================
        // CREATE WIDGET
        // =====================================================

        window.tvWidget = new TradingView.widget({

            container: "tv",

            library_path: "charting_library/",

            datafeed: Datafeed,

            locale: "en",

            timezone: "Asia/Kolkata",

            autosize: true,

            fullscreen: false,

            theme: "light",

            symbol: "NSE:NIFTY 50",

            interval: "1",

            enabled_features: [],

            disabled_features: [

                "use_localstorage_for_settings",

                "header_symbol_search_hot_key"
            ],

            loading_screen: {

                backgroundColor: "#ffffff",

                foregroundColor: "#2962ff"
            },

            overrides: {

                // =================================================
                // BACKGROUND
                // =================================================

                "paneProperties.background": "#ffffff",

                "paneProperties.vertGridProperties.color": "#f0f3fa",

                "paneProperties.horzGridProperties.color": "#f0f3fa",

                // =================================================
                // TEXT
                // =================================================

                "scalesProperties.textColor": "#000000",

                "paneProperties.crossHairProperties.color": "#000000",

                // =================================================
                // WATERMARK
                // =================================================

                "symbolWatermarkProperties.transparency": 0,

                // =================================================
                // CANDLE
                // =================================================

                "mainSeriesProperties.candleStyle.upColor": "#26a69a",

                "mainSeriesProperties.candleStyle.downColor": "#ef5350",

                "mainSeriesProperties.candleStyle.borderUpColor": "#26a69a",

                "mainSeriesProperties.candleStyle.borderDownColor": "#ef5350",

                "mainSeriesProperties.candleStyle.wickUpColor": "#26a69a",

                "mainSeriesProperties.candleStyle.wickDownColor": "#ef5350",

                // =================================================
                // PRICE LINE
                // =================================================

                "mainSeriesProperties.priceLineColor": "#2962ff",

                "mainSeriesProperties.showPriceLine": true,

                // =================================================
                // LAST VALUE
                // =================================================

                "mainSeriesProperties.showSeriesLastValue": true
            }
        });

        // =====================================================
        // CHART READY
        // =====================================================

        window.tvWidget.onChartReady(() => {

            console.log("✅ TradingView Ready");

            const chart = window.tvWidget.chart();

            // =================================================
            // EMA CANVAS
            // =================================================

            const canvas = document.getElementById("emaCanvas");

            const ctx = canvas.getContext("2d");

            // =================================================
            // RESIZE
            // =================================================

            function resizeCanvas() {

                canvas.width = window.innerWidth;

                canvas.height = window.innerHeight;
            }

            resizeCanvas();

            window.addEventListener(
                "resize",
                resizeCanvas
            );

            // =================================================
            // SOCKET EMA
            // =================================================

            socket.on("tick_ema", (data) => {

                // =============================================
                // STORE EMA
                // =============================================

                emaPoints.push(data.ema);

                pricePoints.push(data.price);

                // =============================================
                // LIMIT MEMORY
                // =============================================

                if (emaPoints.length > 500) {

                    emaPoints.shift();

                    pricePoints.shift();
                }

                // =============================================
                // DRAW
                // =============================================

                drawEMA();
            });

            // =================================================
            // DRAW EMA
            // =================================================

            function drawEMA() {

                ctx.clearRect(
                    0,
                    0,
                    canvas.width,
                    canvas.height
                );

                if (emaPoints.length < 2)
                    return;

                // =============================================
                // PRICE RANGE
                // =============================================

                const maxPrice = Math.max(
                    ...pricePoints
                );

                const minPrice = Math.min(
                    ...pricePoints
                );

                const range = (
                    maxPrice - minPrice
                );

                if (range <= 0)
                    return;

                // =============================================
                // LINE STYLE
                // =============================================

                ctx.beginPath();

                ctx.lineWidth = 2;

                ctx.strokeStyle = "#2962ff";

                // =============================================
                // DRAW
                // =============================================

                emaPoints.forEach((ema, index) => {

                    const x = (

                        index / (emaPoints.length - 1)

                    ) * canvas.width;

                    const y = (

                        canvas.height -

                        (
                            (
                                ema - minPrice
                            ) / range
                        ) * canvas.height

                    );

                    if (index === 0) {

                        ctx.moveTo(x, y);

                    } else {

                        ctx.lineTo(x, y);
                    }
                });

                ctx.stroke();
            }

            // =================================================
            // INTERVAL CHANGE
            // =================================================

            chart.onIntervalChanged().subscribe(

                null,

                () => {

                    console.log(
                        "⏱ Timeframe Changed"
                    );

                    setTimeout(() => {

                        try {

                            chart.executeActionById(
                                "chartAutoScale"
                            );

                            chart.executeActionById(
                                "chartReset"
                            );

                        } catch (e) {

                            console.log(
                                "AutoScale Error:",
                                e
                            );
                        }

                    }, 100);
                }
            );

            // =================================================
            // SYMBOL CHANGE
            // =================================================

            chart.onSymbolChanged().subscribe(

                null,

                (symbolInfo) => {

                    console.log(
                        "📈 Symbol Changed:",
                        symbolInfo
                    );

                    // =========================================
                    // RESET EMA
                    // =========================================

                    emaPoints.length = 0;

                    pricePoints.length = 0;

                    ctx.clearRect(
                        0,
                        0,
                        canvas.width,
                        canvas.height
                    );
                }
            );

            // =================================================
            // AUTO SCALE
            // =================================================

            setTimeout(() => {

                try {

                    chart.executeActionById(
                        "chartAutoScale"
                    );

                } catch (e) {

                    console.log(e);
                }

            }, 1000);

        });

    </script>

</body>

</html>
